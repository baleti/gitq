# Build, lint and test on every push and PR, then run the golden corpus.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Configure git for the fixture repository
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The unit tests don't touch the CLI surface.  The corpus runs the
      # real binary over a real repository and A/B's the gix backend
      # against subprocess git — 0 mismatches is the contract that lets
      # either backend be used interchangeably.
      - name: Golden corpus (gix vs subprocess git)
        run: make corpus
